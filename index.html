<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo, a simple task list</title>
  <meta name="description" content="A simple todo list: add tasks, set a due date, tick them off and filter. Saved in your browser.">
  <meta name="theme-color" content="#fbfaf9">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>
    // Before first paint: the saved choice wins, otherwise follow the device/browser theme.
    try {
      var t = localStorage.getItem('todo_theme');
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if (t === 'dark') document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
</head>
<body>
  <header class="top wrap">
    <a class="brand" href="./">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M9.5 16.5l4.2 4.2 8.8-9.4" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Todo
    </a>
    <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch dark or light theme">
      <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main class="wrap">
    <p id="today" class="today"></p>
    <h1 id="headline">Your tasks</h1>

    <form id="add" class="add" autocomplete="off">
      <label class="sr-only" for="new-text">New task</label>
      <input id="new-text" type="text" maxlength="200" placeholder="Add a task, then press Enter" required>
      <label class="sr-only" for="new-due">Due date (optional)</label>
      <input id="new-due" type="date" title="Due date (optional)">
      <button class="btn-add" type="submit">Add</button>
    </form>

    <div class="bar">
      <div class="tabs" role="group" aria-label="Show">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">To do</button>
        <button type="button" data-filter="done" aria-pressed="false">Done</button>
      </div>
      <p id="count" class="count" aria-live="polite"></p>
    </div>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden></p>

    <div class="list-foot" id="list-foot" hidden>
      <button type="button" id="clear-done" class="link-btn">Clear done tasks</button>
    </div>
  </main>

  <footer class="foot wrap">
    <p>Built by <a href="https://zakyprojects.github.io/">Zakria Khan</a>. Your tasks are saved only in this browser.</p>
    <p><a href="https://github.com/zakyprojects/todo">Source code</a></p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-text"></span>
    <button type="button" id="toast-undo">Undo</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
