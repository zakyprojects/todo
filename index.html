<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo, a simple task list</title>
  <meta name="description" content="A simple todo app: make your own lists, add tasks with due dates and notes, tick them off and filter. Saved in your browser.">
  <link rel="canonical" href="https://zakyprojects.github.io/todo/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Zakria Khan">
  <meta property="og:title" content="Todo, a simple task list">
  <meta property="og:description" content="A simple todo app: make your own lists, add tasks with due dates and notes, tick them off and filter. Saved in your browser.">
  <meta property="og:url" content="https://zakyprojects.github.io/todo/">
  <meta name="twitter:card" content="summary">
  <script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "Todo", "url": "https://zakyprojects.github.io/todo/", "description": "A simple todo app: make your own lists, add tasks with due dates and notes, tick them off and filter. Saved in your browser.", "applicationCategory": "ProductivityApplication", "operatingSystem": "Any", "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}, "author": {"@type": "Person", "name": "Zakria Khan", "url": "https://zakyprojects.github.io/"}}</script>
  <meta name="theme-color" content="#fbfaf9">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>
    // Before first paint: the saved choice wins, otherwise follow the device/browser theme.
    try {
      var t = localStorage.getItem('todo_theme');
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if (t === 'dark') document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M9.5 16.5l4.2 4.2 8.8-9.4" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Todo
    </a>
    <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch dark or light theme">
      <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="app">
    <!-- Lists -->
    <nav class="lists" aria-label="Lists">
      <div class="col-head lists-head">
        <h2>Lists</h2>
        <button type="button" class="icon-btn small" id="new-list-btn" aria-label="New list">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <form id="new-list-form" class="new-list" hidden autocomplete="off">
        <label class="sr-only" for="new-list-name">List name</label>
        <input id="new-list-name" type="text" maxlength="40" placeholder="List name, then Enter">
      </form>
      <ul id="list-nav" class="list-nav"></ul>
    </nav>

    <!-- Tasks of the chosen list -->
    <main class="tasks">
      <div class="col-head list-title-row">
        <label class="sr-only" for="list-title">List name</label>
        <input id="list-title" class="list-title" type="text" maxlength="40" title="Click to rename this list">
        <button type="button" class="icon-btn small" id="delete-list-btn" aria-label="Delete this list">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
        </button>
      </div>
      <p id="today" class="today"></p>

      <form id="add" class="add" autocomplete="off">
        <label class="sr-only" for="new-text">New task</label>
        <input id="new-text" type="text" maxlength="200" placeholder="Add a task, then press Enter" required>
        <label class="sr-only" for="new-notes">Notes (optional)</label>
        <textarea id="new-notes" rows="3" maxlength="4000" placeholder="Notes (optional)" hidden></textarea>
        <div class="add-bar">
          <label class="sr-only" for="new-due">Due date (optional)</label>
          <input id="new-due" type="date" title="Due date (optional)">
          <button type="button" class="notes-toggle" id="notes-toggle" aria-expanded="false" aria-controls="new-notes">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
            Notes
          </button>
          <button class="btn-add" type="submit">Add</button>
        </div>
      </form>

      <div class="bar">
        <div class="tabs" role="group" aria-label="Show">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="active" aria-pressed="false">To do</button>
          <button type="button" data-filter="done" aria-pressed="false">Done</button>
        </div>
        <p id="count" class="count" aria-live="polite"></p>
      </div>

      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden></p>
      <div class="list-foot" id="list-foot" hidden>
        <button type="button" id="clear-done" class="link-btn">Clear done tasks</button>
      </div>
    </main>

    <!-- Details of the chosen task -->
    <aside class="details" id="details" aria-label="Task details">
      <div class="col-head details-head">
        <h2 class="details-title">Details</h2>
        <button type="button" class="back" id="details-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          Back
        </button>
        <label class="done-toggle" id="done-toggle" hidden><input type="checkbox" class="check" id="d-done"> <span>Done</span></label>
      </div>
      <div class="details-empty" id="details-empty">
        <p>Pick a task to see its details and notes.</p>
      </div>
      <form class="details-body" id="details-body" hidden autocomplete="off">
        <label class="field-label first" for="d-text">Task</label>
        <textarea id="d-text" class="d-text" rows="2" maxlength="200"></textarea>

        <div class="field-row">
          <div>
            <label class="field-label" for="d-due">Due date</label>
            <input id="d-due" type="date">
          </div>
          <div>
            <label class="field-label" for="d-list">List</label>
            <select id="d-list"></select>
          </div>
        </div>

        <label class="field-label" for="d-notes">Notes</label>
        <textarea id="d-notes" class="d-notes" rows="8" maxlength="4000" placeholder="Add details, links or steps"></textarea>

        <div class="details-foot">
          <span id="d-created" class="muted"></span>
          <button type="button" class="danger-btn" id="d-delete">Delete task</button>
        </div>
      </form>
    </aside>
  </div>

  <footer class="foot">
    <p>Built by <a href="https://zakyprojects.github.io/">Zakria Khan</a>. Your tasks are saved only in this browser.</p>
    <p><a href="https://github.com/zakyprojects/todo">Source code</a></p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-text"></span>
    <button type="button" id="toast-undo">Undo</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
